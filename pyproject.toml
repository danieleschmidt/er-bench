[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "er-bench"
version = "0.1.0"
description = "Standardized Entity Resolution Benchmark Suite with 5-tier cascade"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Schmidt", email = "danschmidt88@gmail.com" }
]
keywords = ["entity-resolution", "record-linkage", "benchmark", "nlp", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast = [
    "jellyfish>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jellyfish>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.scripts]
er-bench = "er_bench.cli:main"

[project.urls]
Homepage = "https://github.com/danieleschmidt/er-bench"
Repository = "https://github.com/danieleschmidt/er-bench"
Issues = "https://github.com/danieleschmidt/er-bench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["er_bench*"]

[tool.setuptools.package-data]
"*" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["er_bench"]
omit = ["tests/*"]
